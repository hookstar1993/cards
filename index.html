<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Information Cards</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jost -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom font for the page */
        body {
            font-family: "Jost", sans-serif;
        }
        /* Train animation setup */
        .train-container {
            position: relative;
            width: 100%;
            height: 96px; /* Same as the circle height */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .train-track {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #e5e7eb; /* gray-200 */
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }
        .train {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            animation: move-train 4s linear infinite;
            z-index: 15; /* Above the track */
        }
        @keyframes move-train {
            0% {
                left: -12px; /* Start off-screen */
            }
            100% {
                left: calc(100% - 12px); /* End off-screen */
            }
        }
        /* Ticket cut-out effect */
        .ticket-card {
            position: relative;
        }
        .ticket-card::before,
        .ticket-card::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 40px;
            background-color: #f3f4f6; /* Same as body bg-gray-100 */
            border-radius: 50%;
            z-index: 20;
        }
        .ticket-card::before {
            left: 0;
            transform: translate(-50%, -50%);
        }
        .ticket-card::after {
            right: 0;
            transform: translate(50%, -50%);
        }
        /* Toast Notification Styling */
        #toast-notification {
            position: fixed;
            bottom: 1.25rem; /* 20px */
            left: 50%;
            transform: translate(-50%, 5rem); /* Start centered and below view */
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            pointer-events: none; /* Prevent clicks when hidden */
        }
        #toast-notification.show {
            transform: translate(-50%, 0); /* Move to final centered position */
            opacity: 1;
            pointer-events: auto; /* Allow clicks when visible */
        }
    </style>
</head>
<body class="bg-gray-100 p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl mx-auto space-y-8">
        <!-- Month Filter Dropdown -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden p-4 ticket-card">
             <label for="month-filter" class="block text-sm font-medium text-gray-700 mb-1">Mahina Select Karein:</label>
            <select id="month-filter" name="month-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <div id="main-container" class="space-y-8">
            <!-- Cards ya Loader yahan dikhega -->
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast-notification" class="bg-gray-800 text-white py-2 px-4 rounded-lg shadow-lg z-50">
        <p id="toast-message"></p>
    </div>

    <script>
        // --- AAPKA GOOGLE SHEET KA LINK YAHAN PASTE KAREIN ---
        const googleSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqINNmQ6CtGixfyo5goqhTKfVwIMGjQi_5MIc4FtTx053jXO2QftjgUt26XLQXE8Ld7kt7VEPK4TJO/pub?output=csv';

        // --- GLOBAL VARIABLES ---
        let allBookingsData = [];
        const monthFilter = document.getElementById('month-filter');
        const mainContainer = document.getElementById('main-container');
        const toastElement = document.getElementById('toast-notification');
        const toastMessage = document.getElementById('toast-message');
        let toastTimeout;

        // Loader ka HTML template
        const loaderHtml = `
            <div class="text-center p-10">
                <svg aria-hidden="true" class="inline w-10 h-10 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                    <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0492C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
                </svg>
                <p class="mt-4 text-gray-600 font-semibold">Data load ho raha hai...</p>
            </div>
        `;

        // --- TOAST NOTIFICATION FUNCTIONS ---
        function showToast(message) {
            clearTimeout(toastTimeout);
            toastMessage.textContent = message;
            toastElement.classList.add('show');
            toastTimeout = setTimeout(() => {
                toastElement.classList.remove('show');
            }, 3000);
        }

        function handlePdfClick(pdfLink) {
            if (pdfLink && pdfLink.trim() !== '' && pdfLink.trim() !== '#') {
                window.open(pdfLink, '_blank');
            } else {
                showToast('Link abhi uplabdh nahi hai.');
            }
        }

        // CSV data ko parse karne ka function
        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const obj = {};
                const currentline = lines[i].split(',');
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = currentline[j] ? currentline[j].trim().replace(/"/g, '') : '';
                }
                data.push(obj);
            }
            return data;
        }
        
        // Chune gaye mahine ke liye cards render karne ka function
        function renderCards(selectedMonth) {
            mainContainer.innerHTML = ''; // Purane cards ya loader ko saaf karein

            const filteredData = allBookingsData.filter(row => row.month === selectedMonth);
            
            if (filteredData.length === 0) {
                mainContainer.innerHTML = `<p class="text-center text-gray-500 p-10">Is mahine ke liye koi booking nahi hai.</p>`;
                return;
            }
            
            const bookings = new Map();

            filteredData.forEach(row => {
                const key = row.month + '-' + row.type + '-' + (row.booking_no_pnr || Math.random());
                if (!bookings.has(key)) {
                    bookings.set(key, { ...row, passengers: [] });
                }
                if(row.guest_name) {
                     bookings.get(key).passengers.push(row);
                }
            });

            for (const [key, item] of bookings.entries()) {
                if (item.type === 'stay') {
                    createStayCard(item, mainContainer);
                } else if (item.type === 'travel') {
                    createTravelCard(item, mainContainer);
                }
            }
        }

        function createStayCard(stay, container) {
            const stayCard = document.createElement('div');
            stayCard.className = 'bg-white rounded-2xl shadow-lg overflow-hidden ticket-card';

            let guestHtml = '';
            stay.passengers.forEach(guest => {
                guestHtml += `
                            <div class="flex items-center justify-between bg-gray-50 p-1 rounded-lg">
                                <div class="flex items-center w-1/3">
                                    <div class="bg-blue-100 text-blue-600 rounded-full h-6 w-6 flex items-center justify-center font-bold mr-3 text-xs">${guest.guest_initials}</div>
                                    <p class="font-semibold text-gray-800 text-sm">${guest.guest_name}</p>
                                </div>
                                <div class="w-1/3 text-center"></div>
                                <div class="text-right w-1/3">
                                    <p class="text-sm text-gray-500">Amount</p>
                                    <p class="font-bold text-gray-800">₹ ${guest.fare}</p>
                                </div>
                            </div>`;
            });
            
            stayCard.innerHTML = `
                <div class="bg-blue-600 p-4 text-center relative">
                    <h2 class="text-xl font-bold text-white">Stay Information</h2>
                    <div class="bg-white text-blue-800 text-sm font-semibold px-3 py-1.5 rounded-full flex items-center absolute top-4 right-4">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                        <span>${stay.status}</span>
                    </div>
                </div>
                <div class="p-6">
                     <div class="flex justify-between items-start -mt-2 mb-4">
                         <div>
                             <p class="text-sm text-gray-500">Hotel/Dharamshala/Guest House</p>
                             <p class="font-semibold text-gray-800">${stay.name}</p>
                         </div>
                         <div class="text-right">
                              <p class="text-sm text-gray-500">Booking No.</p>
                              <p class="font-mono font-bold text-gray-800">${stay.booking_no_pnr}</p>
                         </div>
                     </div>
                     <div class="flex items-center justify-between text-center mt-8">
                         <div class="w-1/3">
                             <p class="text-sm text-gray-500">Check In</p>
                             <p class="font-bold text-gray-800 flex items-center justify-center gap-2 mt-1">
                                 <i class="fas fa-calendar-days text-gray-500"></i>
                                 <span>${stay.check_in_date}</span>
                             </p>
                             <p class="text-gray-600 text-sm flex items-center justify-center gap-2">
                                 <i class="fas fa-clock text-gray-500"></i>
                                 <span>${stay.check_in_time}</span>
                             </p>
                         </div>
                         <div class="w-1/3 flex justify-center">
                             <div class="w-24 h-24 bg-blue-50 border-4 border-blue-200 rounded-full flex flex-col items-center justify-center">
                                 <p class="font-bold text-blue-800 text-xl">${stay.duration_days}</p>
                                 <p class="text-xs text-blue-600">${stay.duration_hours}</p>
                             </div>
                         </div>
                         <div class="w-1/3">
                             <p class="text-sm text-gray-500">Check Out</p>
                             <p class="font-bold text-gray-800 flex items-center justify-center gap-2 mt-1">
                                 <i class="fas fa-calendar-days text-gray-500"></i>
                                 <span>${stay.check_out_date}</span>
                             </p>
                             <p class="text-gray-600 text-sm flex items-center justify-center gap-2">
                                 <i class="fas fa-clock text-gray-500"></i>
                                 <span>${stay.check_out_time}</span>
                             </p>
                         </div>
                     </div>
                      <div class="border-t border-gray-200 pt-4 mt-8">
                           <div class="space-y-2">${guestHtml}</div>
                      </div>
                </div>
                <div class="bg-gray-50 px-6 py-4">
                    <a href="javascript:void(0);" onclick="handlePdfClick('${stay.pdf_link}')" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300 flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        View Booking PDF
                    </a>
                </div>`;
            container.appendChild(stayCard);
        }

        function createTravelCard(travel, container) {
            const travelCard = document.createElement('div');
            travelCard.className = 'bg-white rounded-2xl shadow-lg overflow-hidden travel-card ticket-card';
            
            let passengerHtml = '', pnrHtml = '', headerClass = '', chipClass = '', chipIcon = '', chipText = '', trainColor = '', durationCircleClass = '', durationTextClass = '', footerButtonHtml = '';

            const createFooterButton = (link, bgColor, hoverBgColor, iconSvg, text) => {
                return `<a href="javascript:void(0);" onclick="handlePdfClick('${link}')" class="w-full ${bgColor} ${hoverBgColor} text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center">${iconSvg}${text}</a>`;
            };

            switch (travel.status) {
                case 'confirmed':
                    headerClass = 'bg-green-600'; chipClass = 'bg-white text-green-800'; chipIcon = `<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>`; chipText = 'Confirmed'; 
                    pnrHtml = `<p class="text-sm text-gray-500">PNR</p><p class="font-mono font-bold text-gray-800 flex items-center justify-end gap-1.5"><i class="fas fa-ticket-alt text-gray-500"></i><span>${travel.booking_no_pnr}</span></p>`; 
                    trainColor = '#16a34a'; durationCircleClass = 'bg-green-50 border-green-200'; durationTextClass = 'text-green-800';
                    travel.passengers.forEach(p => {
                        passengerHtml += `<div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg"><div class="flex items-center w-1/3"><div class="bg-green-100 text-green-600 rounded-full h-6 w-6 flex items-center justify-center font-bold mr-2 text-xs">${p.guest_initials}</div><p class="font-semibold text-gray-800 text-sm">${p.guest_name}</p></div><div class="text-center w-1/3"><p class="font-semibold text-gray-800 text-sm">${p.seat_no}</p><p class="text-xs text-gray-500">${p.berth}</p></div><div class="text-right w-1/3"><p class="text-sm text-gray-500">Fare</p><p class="font-bold text-gray-800">₹ ${p.fare}</p></div></div>`;
                    });
                    footerButtonHtml = createFooterButton(travel.pdf_link, 'bg-green-600', 'hover:bg-green-700', '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>', 'View Booking PDF');
                    break;
                case 'pending':
                    headerClass = 'bg-yellow-500'; chipClass = 'bg-white text-yellow-800'; chipIcon = `<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg>`; chipText = 'Pending'; 
                    pnrHtml = `<p class="text-sm text-gray-500">PNR</p><p class="font-mono font-bold text-gray-800 flex items-center justify-end gap-1.5"><i class="fas fa-ticket-alt text-gray-500"></i><span>${travel.booking_no_pnr}</span></p>`; 
                    trainColor = '#f59e0b'; durationCircleClass = 'bg-yellow-50 border-yellow-200'; durationTextClass = 'text-yellow-800';
                    travel.passengers.forEach(p => {
                        passengerHtml += `<div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg"><div class="flex items-center w-1/3"><div class="bg-yellow-100 text-yellow-600 rounded-full h-6 w-6 flex items-center justify-center font-bold mr-2 text-xs">${p.guest_initials}</div><p class="font-semibold text-gray-800 text-sm">${p.guest_name}</p></div><div class="text-center w-1/3"><p class="font-semibold text-gray-800 text-sm">${p.seat_no}</p><p class="text-xs text-gray-500">${p.berth}</p></div><div class="text-right w-1/3"><p class="text-sm text-gray-500">Fare</p><p class="font-bold text-gray-800">₹ ${p.fare}</p></div></div>`;
                    });
                    footerButtonHtml = createFooterButton(travel.pdf_link, 'bg-yellow-500', 'hover:bg-yellow-600', '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M4 12a8 8 0 0114.32-4.995M20 20v-5h-5m0 5a8 8 0 01-14.32-4.995"></path></svg>', 'Check Status');
                    break;
                case 'not-booked':
                    headerClass = 'bg-red-500'; chipClass = 'bg-white text-red-800'; chipIcon = `<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`; chipText = 'Not Booked'; trainColor = '#ef4444'; durationCircleClass = 'bg-red-50 border-red-200'; durationTextClass = 'text-red-800';
                    passengerHtml = `<div class="text-center"><p class="text-gray-600">Aapne is yatra ke liye ticket book nahi kiya hai.</p></div>`;
                    footerButtonHtml = createFooterButton(travel.pdf_link, 'bg-gray-800', 'hover:bg-gray-900', '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>', 'Book Now');
                    break;
            }

            travelCard.innerHTML = `
                <div class="status-header p-4 text-center relative ${headerClass}">
                    <h2 class="text-xl font-bold text-white">Travel Information</h2>
                     <div class="status-chip text-sm font-semibold px-3 py-1.5 rounded-full flex items-center absolute top-4 right-4 ${chipClass}">
                         <span class="status-icon w-4 h-4 mr-2">${chipIcon}</span>
                         <span class="status-text">${chipText}</span>
                    </div>
                </div>
                <div class="p-6">
                    <div class="flex justify-between items-start -mt-2 mb-4">
                        <div>
                            <p class="text-sm text-gray-500">Train</p>
                            <p class="font-semibold text-gray-800">${travel.name} (${travel.train_no})</p>
                        </div>
                        <div class="pnr-container text-right">${pnrHtml}</div>
                    </div>
                    <div class="flex items-center justify-between text-center my-8">
                        <div class="w-1/3 flex flex-col items-center">
                            <p class="text-sm text-gray-500 mb-1">Departure</p>
                            <svg class="w-8 h-8 text-gray-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.5 1.5 0 012.122 0l8.954 8.955M2.25 12v10.5a1.5 1.5 0 001.5 1.5h16.5a1.5 1.5 0 001.5-1.5V12M10.5 21V15a1.5 1.5 0 011.5-1.5h0a1.5 1.5 0 011.5 1.5v6" /></svg>
                            <p class="font-bold text-gray-800 text-lg">${travel.departure_city}</p>
                            <p class="text-gray-600 text-sm flex items-center gap-1.5 mt-1">
                                <i class="fas fa-calendar-days fa-xs text-gray-500"></i>
                                <span>${travel.start_date}</span>
                            </p>
                            <p class="text-gray-600 text-sm flex items-center gap-1.5">
                                <i class="fas fa-clock fa-xs text-gray-500"></i>
                                <span>${travel.start_time}</span>
                            </p>
                        </div>
                        <div class="w-1/3 px-2 train-container">
                            <div class="train-track"><i class="fas fa-train fa-lg train" style="color: ${trainColor};"></i></div>
                            <div class="status-duration-circle w-24 h-24 rounded-full flex flex-col items-center justify-center relative z-10 border-4 ${durationCircleClass}">
                                <p class="status-duration-text font-bold text-lg ${durationTextClass}">${travel.duration_days}</p>
                            </div>
                        </div>
                        <div class="w-1/3 flex flex-col items-center">
                            <p class="text-sm text-gray-500 mb-1">Arrival</p>
                            <svg class="w-8 h-8 text-gray-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" /></svg>
                            <p class="font-bold text-gray-800 text-lg">${travel.arrival_city}</p>
                            <p class="text-gray-600 text-sm flex items-center gap-1.5 mt-1">
                                <i class="fas fa-calendar-days fa-xs text-gray-500"></i>
                                <span>${travel.end_date}</span>
                            </p>
                             <p class="text-gray-600 text-sm flex items-center gap-1.5">
                                <i class="fas fa-clock fa-xs text-gray-500"></i>
                                <span>${travel.end_time}</span>
                            </p>
                        </div>
                    </div>
                    <div class="passenger-details-container border-t border-gray-200 pt-4 space-y-2">${passengerHtml}</div>
                </div>
                <div class="bg-gray-50 px-6 py-4">${footerButtonHtml}</div>`;
            
            container.appendChild(travelCard);
        }

        // Yeh function page load hone par chalega
        async function initializePage() {
            if (!googleSheetUrl || googleSheetUrl.includes('YOUR_GOOGLE_SHEET')) {
                mainContainer.innerHTML = `<p class="text-center text-orange-500">Kripya script mein apni Google Sheet ka CSV link dalein.</p>`;
                return;
            }

            mainContainer.innerHTML = loaderHtml; // Initial loading dikhayein

            try {
                const response = await fetch(`${googleSheetUrl}&_=${new Date().getTime()}`);
                if (!response.ok) {
                    throw new Error(`Network response was not ok: ${response.statusText}`);
                }
                const csvText = await response.text();
                allBookingsData = parseCSV(csvText);
                
                // Dropdown ko banayein
                const months = [...new Set(allBookingsData.map(item => item.month))];
                monthFilter.innerHTML = '<option value="">-- Mahina Chunein --</option>'; // Default option
                months.forEach(month => {
                    const option = document.createElement('option');
                    option.value = month;
                    option.textContent = month;
                    monthFilter.appendChild(option);
                });
                
                // Loader hatakar initial message dikhayein
                mainContainer.innerHTML = `<p class="text-center text-gray-500 p-10">Upar diye gaye dropdown se mahina select karein.</p>`;

            } catch (error) {
                console.error('Error fetching data:', error);
                mainContainer.innerHTML = `<p class="text-center text-red-500">Data load karne mein error aaya. Kripya Google Sheet link aur publishing settings check karein.</p>`;
            }
        }

        // --- EVENTS ---
        document.addEventListener('DOMContentLoaded', () => {
            // Dropdown change hone par
            monthFilter.addEventListener('change', (e) => {
                const selectedMonth = e.target.value;
                if (!selectedMonth) {
                    mainContainer.innerHTML = `<p class="text-center text-gray-500 p-10">Upar diye gaye dropdown se mahina select karein.</p>`;
                    return;
                }
                
                // Loader dikhayein
                mainContainer.innerHTML = loaderHtml;

                // Thoda delay add kar rahe hain taaki loader saaf dikhe
                setTimeout(() => {
                    renderCards(selectedMonth);
                }, 500); // 0.5 second ka delay
            });

            // Page ko initialize karein
            initializePage();

        });

    </script>

</body>
</html>
